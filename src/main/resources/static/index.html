<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <!-- Student Form -->

    <div class="form-container">

        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <label>Name</label>
            <input type="text"
                   id="name"
                   placeholder="Enter student name"
                   required>

            <label>Email</label>
            <input type="email"
                   id="email"
                   placeholder="Enter email"
                   required>

            <label>Phone</label>
            <input type="text"
                   id="phone"
                   placeholder="Enter phone"
                   required>

            <label>Department</label>

            <select id="department" required>

                <option value="">
                    Select Department
                </option>

                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>

            </select>

            <label>Age</label>

            <input type="number"
                   id="age"
                   min="16"
                   max="100"
                   required>

            <label>Marks</label>

            <input type="number"
                   id="marks"
                   min="0"
                   max="100"
                   step="0.01"
                   required>

            <button type="submit">
                Save Student
            </button>

            <button type="button"
                    id="cancelBtn"
                    class="cancel">
                Cancel
            </button>

        </form>

    </div>

    <!-- Search -->

    <div class="search-container">

        <input type="text"
               id="searchInput"
               placeholder="Search by student name">

        <button onclick="searchStudents()">
            Search
        </button>

        <button onclick="loadStudents()">
            Show All
        </button>

        <select id="departmentFilter"
                onchange="filterDepartment()">

            <option value="">
                All Departments
            </option>

            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="MECH">MECH</option>
            <option value="CIVIL">CIVIL</option>

        </select>

    </div>

    <!-- Student Table -->

    <div class="table-container">

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Age</th>
                <th>Marks</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody id="studentTableBody">

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
